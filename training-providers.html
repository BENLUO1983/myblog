<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="国内外知名企业培训与人才发展服务商介绍榜单。">
<title>企业培训与人才发展服务商榜单</title>
<style>
:root{
  --ink:#16233D; --ink2:#3D4B63; --muted:#6B7A93;
  --blue:#2F6DB5; --cyan:#2E9C9C; --gold:#B08136;
  --paper:#F5F8FC; --card:#FFFFFF; --line:#DDE5EF;
  --green:#1F7A55; --amber:#B26A12; --rose:#B03A48;
  --shadow:0 2px 10px rgba(22,35,61,.06); --shadow2:0 8px 28px rgba(22,35,61,.12);
  --radius:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","WenQuanYi Micro Hei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  line-height:1.65; -webkit-font-smoothing:antialiased;
}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1240px; margin:0 auto; padding:0 22px}

/* ---------- header ---------- */
.hero{
  background:linear-gradient(135deg,#142542 0%,#1C3559 48%,#20526E 100%);
  color:#fff; padding:44px 0 34px; position:relative; overflow:hidden;
}
.hero::after{
  content:""; position:absolute; right:-120px; top:-160px; width:520px; height:520px;
  background:radial-gradient(circle,rgba(76,175,190,.28),transparent 65%); pointer-events:none;
}
.hero .kicker{font-size:12px; letter-spacing:.22em; color:#8FC4D6; text-transform:uppercase; margin:0 0 10px}
.hero h1{font-size:clamp(25px,3.6vw,38px); margin:0 0 10px; letter-spacing:.5px; font-weight:700}
.hero .sub{font-size:15px; color:#C9D9EA; margin:0 0 22px; max-width:920px}
.hero .meta{display:flex; flex-wrap:wrap; gap:10px; position:relative; z-index:1}
.hero .meta span{
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18);
  padding:6px 13px; border-radius:999px; font-size:12.5px; color:#E4EEF8;
}
.backlink{display:inline-flex; align-items:center; gap:6px; color:#A9CFE2; font-size:13px; margin-bottom:16px; position:relative; z-index:1}
.backlink:hover{color:#fff; text-decoration:none}

/* ---------- toolbar ---------- */
.toolbar{
  position:sticky; top:0; z-index:20; background:rgba(245,248,252,.94);
  backdrop-filter:blur(9px); border-bottom:1px solid var(--line); padding:12px 0;
}
.toolbar .inner{display:flex; flex-wrap:wrap; gap:9px; align-items:center}
.tabs{display:flex; gap:4px; background:#E9EFF7; padding:4px; border-radius:10px}
.tab{
  border:0; background:transparent; color:var(--ink2); cursor:pointer;
  padding:7px 15px; border-radius:7px; font-size:13.5px; font-family:inherit; white-space:nowrap;
}
.tab.on{background:#fff; color:var(--blue); font-weight:700; box-shadow:var(--shadow)}
select, .search{
  border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:9px;
  padding:8px 11px; font-size:13px; font-family:inherit; outline:none;
}
select:focus, .search:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,109,181,.12)}
.search{min-width:190px; flex:1; max-width:290px}
.btn{
  border:1px solid var(--line); background:#fff; color:var(--ink2); cursor:pointer;
  padding:8px 13px; border-radius:9px; font-size:13px; font-family:inherit; white-space:nowrap;
}
.btn:hover{border-color:var(--blue); color:var(--blue)}
.btn.primary{background:var(--blue); color:#fff; border-color:var(--blue)}
.btn.primary:hover{background:#255C9C; color:#fff}
.count{margin-left:auto; font-size:12.5px; color:var(--muted); white-space:nowrap}

/* ---------- section ---------- */
section{padding:28px 0 6px}
.sec-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px}
.sec-head h2{font-size:20px; margin:0; letter-spacing:.4px}
.sec-head .hint{font-size:13px; color:var(--muted)}
.rule{height:2px; background:linear-gradient(90deg,var(--blue),transparent); width:64px; margin:8px 0 18px; border-radius:2px}

/* ---------- cards ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(348px,1fr)); gap:16px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px 18px 16px; display:flex; flex-direction:column;
  transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{transform:translateY(-3px); box-shadow:var(--shadow2)}
.card .top{display:flex; gap:13px; align-items:flex-start}
.brandmark{
  position:relative; flex:0 0 76px; width:76px; height:76px; border-radius:12px;
  background:#F2F7FC; border:1px solid #DDE7F2;
  background:color-mix(in srgb,var(--brand) 10%,#fff); border-color:color-mix(in srgb,var(--brand) 26%,#fff);
  display:grid; place-items:center; overflow:hidden;
}
.brandmark .fallback{
  font-size:22px; font-weight:800; color:var(--brand); letter-spacing:-.5px; text-align:center; line-height:1.1;
}
.brandmark img{
  position:absolute; inset:6px; width:calc(100% - 12px); height:calc(100% - 12px);
  object-fit:contain; background:#fff; border-radius:6px;
}
.card .id{flex:1; min-width:0}
.rankline{display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap}
.rank{
  display:inline-grid; place-items:center; width:24px; height:24px; border-radius:7px;
  background:var(--ink); color:#fff; font-size:12.5px; font-weight:700;
}
.rank.intl{background:var(--cyan)}
.region{font-size:11px; color:var(--muted); border:1px solid var(--line); padding:1px 7px; border-radius:999px}
.card h3{font-size:17.5px; margin:0 0 2px; line-height:1.35}
.name-link{color:var(--ink); text-decoration:none; border-bottom:1px dashed transparent; transition:color .15s,border-color .15s}
.name-link:hover{color:var(--blue); text-decoration:none; border-bottom-color:var(--blue)}
.name-link .ext{font-size:12px; color:#9BAAC0; margin-left:3px; font-weight:400; vertical-align:1px}
.name-link:hover .ext{color:var(--blue)}
.card .en{font-size:12px; color:var(--muted); margin:0 0 8px; word-break:break-word}
.facts{display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:12.8px; color:var(--ink2)}
.facts dt{color:var(--muted); white-space:nowrap}
.facts dd{margin:0}
.chips{display:flex; flex-wrap:wrap; gap:5px; margin:13px 0 10px}
.chip{font-size:11.5px; padding:3px 9px; border-radius:999px; background:#EEF4FB; color:#2A5A96; border:1px solid #DBE8F6}
.feature{font-size:13.3px; color:var(--ink2); margin:0 0 12px}
.scale{
  background:#F7FAFE; border:1px solid #E6EEF8; border-radius:10px; padding:10px 12px; margin-bottom:12px;
}
.scale .lab{font-size:11px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; margin-bottom:6px}
.scale ul{margin:0; padding:0; list-style:none; display:grid; gap:4px}
.scale li{
  font-size:12.6px; display:grid; grid-template-columns:minmax(76px,40%) minmax(0,1fr);
  gap:10px; align-items:start; border-bottom:1px dotted #DCE6F2; padding-bottom:5px;
}
.scale li:last-child{border-bottom:0; padding-bottom:0}
.scale li b{color:var(--blue); font-weight:700; text-align:right; overflow-wrap:anywhere; line-height:1.45}
.scale li > span{color:var(--ink2); text-align:left; overflow-wrap:anywhere; line-height:1.45}
.scale li .mini{display:block; font-weight:400; color:var(--muted); font-size:11px; margin-top:2px; line-height:1.4}
details.history{border-top:1px solid var(--line); padding-top:10px; margin-top:auto}
details.history summary{cursor:pointer; font-size:13px; font-weight:600; color:var(--blue); list-style:none; display:flex; align-items:center; gap:7px}
details.history summary::-webkit-details-marker{display:none}
details.history summary::before{content:"▸"; transition:transform .2s; display:inline-block}
details.history[open] summary::before{transform:rotate(90deg)}
.timeline{list-style:none; margin:11px 0 2px; padding:0 0 0 14px; border-left:2px solid #DCE6F2}
.timeline li{position:relative; padding:0 0 10px 12px; font-size:12.6px; color:var(--ink2)}
.timeline li::before{content:""; position:absolute; left:-20px; top:7px; width:7px; height:7px; border-radius:50%; background:var(--blue); border:2px solid #fff}
.timeline li b{color:var(--ink); margin-right:6px}

/* ---------- table ---------- */
.tablewrap{background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:auto; box-shadow:var(--shadow)}
table{border-collapse:collapse; width:100%; font-size:12.8px; min-width:900px}
th,td{padding:11px 13px; text-align:left; border-bottom:1px solid #EDF1F7; vertical-align:top}
th{background:#EEF4FB; color:var(--ink); font-weight:700; position:sticky; top:0; white-space:nowrap; font-size:12px}
tbody tr:hover{background:#FAFCFF}
td b{font-weight:700}
.mini{color:var(--muted); font-size:11.5px}

/* ---------- 延伸名录（默认折叠） ---------- */
.extra-fold{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px; box-shadow:var(--shadow)}
.extra-fold summary{cursor:pointer; font-size:14px; font-weight:600; color:var(--ink2); list-style:none; display:flex; align-items:center; gap:8px}
.extra-fold summary::-webkit-details-marker{display:none}
.extra-fold summary::before{content:"▸"; color:var(--blue); transition:transform .2s; display:inline-block}
.extra-fold[open] summary::before{transform:rotate(90deg)}
.extra-fold .hint{font-size:12px; color:var(--muted); font-weight:400}
.extra-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin-top:14px}
.extra-item{border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:#FAFCFF}
.extra-item b{font-size:13.2px; display:block}
.extra-item span{font-size:12px; color:var(--muted)}
footer{padding:26px 0 36px; color:var(--muted); font-size:12.3px; text-align:center}

@media (max-width:720px){
  .hero{padding:32px 0 26px}
  .grid{grid-template-columns:1fr}
  .count{margin-left:0; width:100%}
  .toolbar .inner{gap:7px}
  .search{max-width:none; flex-basis:100%}
}
@media print{
  body{background:#fff}
  .toolbar,.backlink,.btn,.extra-fold{display:none!important}
  .hero{background:#142542!important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .card{break-inside:avoid; box-shadow:none; border-color:#C9D4E3}
  details.history{display:block}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

/* ---------------- 渲染 ---------------- */
const $ = s => document.querySelector(s);
let state = { group:'cn', type:'', q:'', view:'card' };

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function brandmark(p){
  const img = p.logo ? `<img src="${esc(p.logo)}" alt="${esc(p.name)} 官方标识" onerror="this.remove()">` : '';
  return `<div class="brandmark" style="--brand:${esc(p.brand)}"><span class="fallback">${esc(p.mark)}</span>${img}</div>`;
}

function cardHTML(p){
  const chips = p.types.map(t=>`<span class="chip">${esc(t)}</span>`).join('');
  const scaleItems = p.scale.map(([k,v,note])=>`<li><span>${esc(k)}</span><b>${esc(v)}<span class="mini"> · ${esc(note)}</span></b></li>`).join('');
  const timeline = p.history.map(([y,t])=>`<li><b>${esc(y)}</b>${esc(t)}</li>`).join('');
  const link = `<a class="name-link" href="${esc(siteOf(p))}" target="_blank" rel="noopener noreferrer" title="访问 ${esc(p.name)} 官网">${esc(p.name)}<span class="ext">↗</span></a>`;
  return `<article class="card">
    <div class="top">
      ${brandmark(p)}
      <div class="id">
        <div class="rankline"><span class="rank ${p.group==='intl'?'intl':''}">${p.rank}</span><span class="region">${p.group==='cn'?'中国本土':'国际机构'}</span></div>
        <h3>${link}</h3>
        <p class="en">${esc(p.en)}</p>
        <dl class="facts"><dt>总部</dt><dd>${esc(p.hq)}</dd><dt>成立时间</dt><dd>${esc(p.founded)}</dd></dl>
      </div>
    </div>
    <div class="chips">${chips}</div>
    <p class="feature">${esc(p.feature)}</p>
    <div class="scale"><div class="lab">规模数据</div><ul>${scaleItems}</ul></div>
    <details class="history"><summary>发展沿革</summary><ul class="timeline">${timeline}</ul></details>
  </article>`;
}

function tableHTML(list){
  const rows = list.map(p=>`<tr>
    <td><b>${p.rank}</b></td>
    <td><a class="name-link" href="${esc(siteOf(p))}" target="_blank" rel="noopener noreferrer"><b>${esc(p.name)}</b><span class="ext">↗</span></a><br><span class="mini">${esc(p.en)}</span></td>
    <td>${esc(p.hq)}</td><td>${esc(p.founded)}</td>
    <td>${p.types.map(esc).join('、')}</td>
    <td>${p.scale.slice(0,2).map(([k,v])=>`${esc(k)} <b>${esc(v)}</b>`).join('<br>')}</td>
  </tr>`).join('');
  return `<table><thead><tr><th>序</th><th>企业（点击访问官网）</th><th>总部</th><th>成立时间</th><th>培训类型</th><th>规模数据（摘）</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function filtered(){
  let list = PROVIDERS.filter(p=>{
    if(state.group!=='all' && p.group!==state.group) return false;
    if(state.type && !p.types.some(t=>t.includes(state.type))) return false;
    if(state.q){
      const hay = [p.name,p.en,p.hq,p.founded,p.feature,p.fame,p.types.join(''),p.scale.map(x=>x.join('')).join('')].join(' ').toLowerCase();
      if(!hay.includes(state.q.toLowerCase())) return false;
    }
    return true;
  });
  list.sort((a,b)=>(a.group===b.group?0:(a.group==='cn'?-1:1)) || a.rank-b.rank);
  return list;
}

function render(){
  const list = filtered();
  const isIntl = state.group==='intl';
  $('#secTitle').textContent = state.group==='all' ? '全部 20 家 · 国内在前、国际在后' : (isIntl?'国际机构 · 推荐序':'国内机构 · 推荐序');
  $('#secHint').textContent = state.group==='all'
    ? '国内榜与国际榜各自独立编号，点击名称可访问官网'
    : (isIntl
      ? '全球人才与领导力咨询、培训内容 IP、数字学习平台与综合人服集团'
      : '以培训 / 企业学习为主业的本土服务商，含综合人力资源集团的培训板块');
  $('#grid').innerHTML = list.map(cardHTML).join('');
  $('#tablewrap').innerHTML = tableHTML(list);
  $('#grid').hidden = state.view!=='card';
  $('#tablewrap').hidden = state.view!=='table';
  $('#empty').hidden = list.length>0;
  $('#count').textContent = `当前显示 ${list.length} / 20 家`;
}

/* ---------------- 交互 ---------------- */
$('#tabs').addEventListener('click', e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===b));
  state.group = b.dataset.group; render();
});

const allTypes = [...new Set(PROVIDERS.flatMap(p=>p.types))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
allTypes.forEach(t=>{
  const o=document.createElement('option'); o.value=t; o.textContent=t; $('#typeSel').appendChild(o);
});
$('#typeSel').addEventListener('change', e=>{ state.type=e.target.value; render(); });
$('#q').addEventListener('input', e=>{ state.q=e.target.value.trim(); render(); });
$('#viewBtn').addEventListener('click', ()=>{
  state.view = state.view==='card'?'table':'card';
  $('#viewBtn').textContent = state.view==='card'?'切换表格视图':'切换卡片视图';
  render();
});

$('#extraGrid').innerHTML = EXTRA.map(([n,d])=>`<div class="extra-item"><b>${esc(n)}</b><span>${esc(d)}</span></div>`).join('');

/* 打印时自动展开发展沿革，打印结束恢复原状态 */
let openBeforePrint = [];
window.addEventListener('beforeprint', ()=>{
  const ds=[...document.querySelectorAll('details.history')];
  openBeforePrint = ds.map(d=>d.open);
  ds.forEach(d=>d.open=true);
});
window.addEventListener('afterprint', ()=>{
  [...document.querySelectorAll('details.history')].forEach((d,i)=>d.open=openBeforePrint[i]??false);
});

render();
</script>
